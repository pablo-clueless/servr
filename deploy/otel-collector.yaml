# Collector config for the `obs` compose profile (Q5).
#
# The testbed only ever speaks OTLP here; swapping Jaeger for Tempo, or adding
# an exporter, is a change to this file and nothing in the application.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # No sampling. Phase 8 emits deliberately malformed spans and the point is to
  # see all of them arrive at the backend intact-as-broken.
  batch:
    timeout: 1s

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
  # Keeps corrupted payloads visible in `docker compose logs otel-collector`
  # when a Phase 8 fault makes a backend reject them outright.
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
