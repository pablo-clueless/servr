[package]
name = "servr"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
apalis = "0.7.4"
apalis-sql = "0.7.4"
argon2 = "0.6.0"
axum = "0.8.9"
chrono = "0.4.45"
