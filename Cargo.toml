[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/telemetry",
    "crates/http",
    "crates/ws",
    "crates/stream",
    "crates/queue",
    "crates/mail",
    "crates/hooks",
    "crates/admin",
    "server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Shared versions. Crates opt in via `dep = { workspace = true }` so a version
# bump happens in exactly one place.
[workspace.dependencies]
testbed-core = { path = "crates/core" }
testbed-telemetry = { path = "crates/telemetry" }
testbed-http = { path = "crates/http" }
testbed-ws = { path = "crates/ws" }
testbed-stream = { path = "crates/stream" }
testbed-queue = { path = "crates/queue" }
testbed-mail = { path = "crates/mail" }
testbed-hooks = { path = "crates/hooks" }
testbed-admin = { path = "crates/admin" }

arc-swap = "1.7"
axum = { version = "0.8.9", features = ["ws", "macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
futures-core = "0.3"
futures-util = "0.3"
proptest = "1"
rand = "0.9"
socket2 = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
toml = "0.9"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }

[profile.dev]
# The workspace is small; full debug info costs more link time than it returns.
debug = 1
