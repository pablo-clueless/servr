[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/telemetry",
    "crates/http",
    "crates/ws",
    "crates/stream",
    "crates/queue",
    "crates/mail",
    "crates/hooks",
    "crates/admin",
    "server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Shared versions. Crates opt in via `dep = { workspace = true }` so a version
# bump happens in exactly one place.
[workspace.dependencies]
testbed-core = { path = "crates/core" }
testbed-telemetry = { path = "crates/telemetry" }
testbed-http = { path = "crates/http" }
testbed-ws = { path = "crates/ws" }
testbed-stream = { path = "crates/stream" }
testbed-queue = { path = "crates/queue" }
testbed-mail = { path = "crates/mail" }
testbed-hooks = { path = "crates/hooks" }
testbed-admin = { path = "crates/admin" }

arc-swap = "1.7"
axum = { version = "0.8.9", features = ["ws", "macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
futures-core = "0.3"
# Webhook signing (Q4). All three are already in the lock via other crates.
hex = "0.4"
hmac = "0.12"
futures-util = "0.3"
# SMTP client only. Mailpit owns the server side (§2 decision 6) — nothing here
# may grow into an embedded SMTP server. No TLS feature: Mailpit on localhost is
# plaintext, and the testbed never speaks SMTP to anything else.
# `tokio1-rustls-tls` + `ring` add STARTTLS and let SMTP AUTH be used, which
# an authenticated relay (Brevo, SES, Postmark) requires. Mailpit still gets
# the plaintext path — see `send::Sender::new`. Decision 6 is untouched:
# this is still a client, never an embedded SMTP server.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "ring"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
opentelemetry = "0.32"
# TLS is not optional: decision 9 makes OTLP a first-class output surface, and
# every hosted collector (Grafana Cloud, Honeycomb, Dash0, Uptrace) is https.
# Without a provider *and* a root store, tonic can only reach a plaintext
# collector on localhost — which makes the testbed undeployable as the
# telemetry source it exists to be. webpki roots so a slim image needs no
# system ca-certificates.
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "trace", "tls-ring", "tls-webpki-roots"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry_sdk-testing = { package = "opentelemetry_sdk", version = "0.32", features = ["testing"] }
proptest = "1"
# Already compiled in via opentelemetry-http, so this costs no new tree. Reads
# Mailpit's REST API now; Phase 7 sends outbound webhooks through it.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
# SQLite for control-plane snapshots (decision 3). Deliberately NOT sqlx:
# invariant 3's grep uses `sqlx` as the marker for Postgres I/O, and keeping the
# two bindings distinct keeps that gate precise. `bundled` so no system SQLite
# is required.
rusqlite = { version = "0.37", features = ["bundled"] }
# `tokio-rustls-comp` + webpki roots so `rediss://` works. Every managed Redis
# (Render Key Value, Upstash, ElastiCache in transit-encryption mode) requires
# TLS on its external endpoint; without this a `rediss://` URL fails to connect
# and a `redis://` one is refused outright.
redis = { version = "1.6", features = ["tokio-comp", "script", "connection-manager", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }
rand = "0.9"
socket2 = "0.6"
# `tls-rustls` is not optional in practice: every managed Postgres (Render,
# Neon, Supabase, RDS) requires TLS, and without the feature sqlx fails with
# "TLS upgrade required by connect options but SQLx was built without TLS
# support enabled" — which reads as a network problem, not a build one.
# rustls with webpki roots rather than native-tls: no system OpenSSL, and no
# dependency on ca-certificates being present in a slim image.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros", "tls-rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_urlencoded = "0.7"
sha2 = "0.10"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = "0.29"
toml = "0.9"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tonic = { version = "0.14", default-features = false }
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.0", features = ["v4", "serde"] }

[profile.dev]
# The workspace is small; full debug info costs more link time than it returns.
debug = 1
