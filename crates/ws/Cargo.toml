[package]
name = "testbed-ws"
version.workspace = true
edition.workspace = true
license.workspace = true

# Depends on `core` and `telemetry`, and on no other surface crate
# (HANDOFF §4). If this crate needs to reach another surface, route it through
# the event bus.
[dependencies]
testbed-core.workspace = true
testbed-telemetry.workspace = true

axum.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# Already in the lock via axum's `ws` feature, so a real client costs nothing
# new. T6 is only provable against one: the trap is that a *dropped* handle
# looks fine to anything that does not inspect the close frame.
tokio-tungstenite.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk-testing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
